<mat-toolbar color="primary">
  <div class="toolbar-container">
    <!-- Logo and brand -->
    <div class="brand-section">
      <!-- Mobile menu button with dynamic icon -->
      <button 
        mat-icon-button 
        class="menu-button"
        (click)="onMenuToggle()"
        aria-label="Toggle navigation">
        <mat-icon>{{ menuIcon() }}</mat-icon>
      </button>
      
      <a routerLink="/blog" class="brand-link">
        <h1 class="brand-title">Personal Blog</h1>
      </a>
    </div>

    <!-- Desktop navigation - always visible on desktop -->
    <nav class="desktop-nav">
      <a mat-button routerLink="/blog" routerLinkActive="active">Blog</a>
      <a mat-button routerLink="/auth/login" routerLinkActive="active">Login</a>
      <a mat-button routerLink="/auth/register" routerLinkActive="active">Register</a>
    </nav>
  </div>
</mat-toolbar>

<!-- Mobile menu - controlled by signal -->
@if (mobileMenuOpen()) {
  <div class="mobile-menu">
    <nav class="mobile-nav">
      <a mat-button routerLink="/blog" (click)="onMenuToggle()" class="mobile-nav-item">
        <mat-icon>article</mat-icon>
        <span>Blog</span>
      </a>
      <a mat-button routerLink="/auth/login" (click)="onMenuToggle()" class="mobile-nav-item">
        <mat-icon>login</mat-icon>
        <span>Login</span>
      </a>
      <a mat-button routerLink="/auth/register" (click)="onMenuToggle()" class="mobile-nav-item">
        <mat-icon>person_add</mat-icon>
        <span>Register</span>
      </a>
    </nav>
  </div>
}
